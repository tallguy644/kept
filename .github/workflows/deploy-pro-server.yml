name: Deploy Pro server (Cloudflare)

# Uploads worker/ (the Kept Pro server: checks store purchases, links them to accounts, Pro+ sync) to Cloudflare Workers.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token).
# Optional secrets, copied into the Worker when present: GOOGLE_SA_JSON (Play + Firestore service account key),
# FIREBASE_SA_JSON, ARGYLE_KEY_ID, ARGYLE_KEY_SECRET, ARGYLE_WEBHOOK_SECRET. Secret values never appear in the logs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-pro-server.yml'

permissions:
  contents: read

concurrency:
  group: pro-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test the server
        run: node worker/test/plus.test.mjs

      - name: No Cloudflare token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice title=Pro server::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the Pro server."

      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          echo "::notice title=Pro server address::${URL:-see log}"

      - name: Copy secrets into the Worker
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          ARGYLE_KEY_ID: ${{ secrets.ARGYLE_KEY_ID }}
          ARGYLE_KEY_SECRET: ${{ secrets.ARGYLE_KEY_SECRET }}
          ARGYLE_WEBHOOK_SECRET: ${{ secrets.ARGYLE_WEBHOOK_SECRET }}
        run: |
          for name in GOOGLE_SA_JSON FIREBASE_SA_JSON ARGYLE_KEY_ID ARGYLE_KEY_SECRET ARGYLE_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx --yes wrangler@4 secret put "$name" >/dev/null && echo "$name copied"
            else
              echo "$name not set (skipped)"
            fi
          done
