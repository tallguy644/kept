# Publishes Kept to Firebase Hosting (your own address) on every push to main.
# Needs two repository settings (see ACCOUNTS.md): secret FIREBASE_SERVICE_ACCOUNT and variable FIREBASE_PROJECT_ID.
# Does nothing until they are set, so GitHub Pages keeps working in the meantime.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
